<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Apollo unavailable</title>
  <style>
    :root { color-scheme: dark light; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: max(28px, env(safe-area-inset-top)) 24px max(28px, env(safe-area-inset-bottom)); background: #000000; color: #f5f5f5; }
    main { width: min(100%, 360px); text-align: center; }
    svg { width: 48px; height: 48px; margin-bottom: 28px; }
    h1 { margin: 0 0 10px; font-size: 25px; letter-spacing: -.03em; }
    p { margin: 0 auto 26px; color: #929292; font-size: 15px; line-height: 1.5; }
    button { min-height: 48px; padding: 0 24px; border: 0; border-radius: 15px; background: #f3f3f3; color: #101010; font: 600 16px/1 inherit; }
    button:active { transform: scale(.97); }
    @media (prefers-color-scheme: light) { body { background: #f7f7f5; color: #111; } p { color: #686868; } button { background: #111; color: #fff; } }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 25 14.5 6 27 25" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M6.5 20C11 15.5 18 14.5 27 19" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/></svg>
