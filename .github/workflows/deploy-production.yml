name: Deploy production
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: production-deployment
  cancel-in-progress: false
jobs:
  deploy:
    name: Deploy prepared release to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Deploy exact prepared revision and verify services
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" bash -s -- "$DEPLOY_REVISION" <<'REMOTE'
          set -euo pipefail
          umask 077
          revision=$1
          cd /root/Apollo
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$revision"
          stage=$(mktemp /root/apollo-deploy-script.XXXXXX)
          trap 'rm -f "$stage"' EXIT
          git show "$revision:scripts/deploy-production.sh" > "$stage"
          bash "$stage" "$revision"
          REMOTE
      - name: Remove SSH credentials
        if: always()
        run: rm -f ~/.ssh/id_ed25519
