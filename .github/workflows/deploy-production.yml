name: Deploy production

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_SSH_KEY"

          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy main and verify services
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"

          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -i ~/.ssh/id_ed25519 \
            "$VPS_USER@$VPS_HOST" \
            'bash -se' <<'REMOTE'
          set -euo pipefail

          cd /root/Apollo
          git fetch origin main
          git checkout main

          # Preserve any emergency server-local edit before fast-forwarding.
          # A deployment must never silently overwrite it.
          if ! git diff --quiet || ! git diff --cached --quiet; then
            git stash push -m "apollo pre-deploy $(date -u +%Y%m%dT%H%M%SZ)"
          fi
          git pull --ff-only origin main

          # Install the server-side Web Push dependency before the backend
          # starts. VAPID keys remain in the server environment, never here.
          if ! python3 -m pip --version >/dev/null 2>&1; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y python3-pip
          fi
          # Do not ask pip to uninstall Debian-managed packages (they have no
          # pip RECORD metadata). Install Apollo's isolated dependency copies
          # alongside the operating-system packages instead.
          python3 -m pip install --break-system-packages --ignore-installed --disable-pip-version-check -r requirements.txt

          systemctl restart apollo-backend apollo-web
          systemctl is-active --quiet apollo-backend
          systemctl is-active --quiet apollo-web

          systemctl --no-pager --full status apollo-backend apollo-web
          REMOTE

      - name: Remove SSH credentials
        if: always()
        run: rm -f ~/.ssh/id_ed25519
